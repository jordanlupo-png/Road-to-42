name: Build Android Health Companion

on:
  push:
    branches: [health-connect]
    paths:
      - 'android-health/**'
      - '.github/workflows/android-health.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        working-directory: android-health
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: road-to-42-health-debug
          path: android-health/app/build/outputs/apk/debug/app-debug.apk
