left:50%;transform:translateX(-50%);z-index:30;width:min(520px,calc(100% - 28px));padding:14px 16px;border:1px solid var(--gold);border-radius:12px;background:#102437ee;box-shadow:0 16px 45px #0009;backdrop-filter:blur(12px);font-weight:750}.evolutionOverlay{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 50% 46%,#39617e,#07172b 68%);overflow:hidden}.evolutionOverlay.hidden{display:none}.evolutionSky{position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent,#f8d88a55,transparent 12%,#73dba055,transparent 24%);animation:evolutionSpin 7s linear infinite}.evolutionContent{position:relative;z-index:1;width:min(480px,100%);text-align:center}.evolutionContent>small{color:var(--gold);font-weight:850;letter-spacing:.18em}.evolutionContent h2{font-size:clamp(1.8rem,8vw,2.8rem);margin:8px 0}.evolutionContent p{color:#d6e1ea}.evolutionStage{height:min(47vh,390px);position:relative;display:grid;place-items:center;margin:4px 0}.evolutionAvatar{position:absolute;width:88%;height:100%;object-fit:contain;filter:drop-shadow(0 18px 25px #0008)}.evolutionOld{animation:evolutionOld 3.2s ease forwards}.evolutionNew{opacity:0;animation:evolutionNew 3.2s ease forwards}.evolutionBurst{width:32%;aspect-ratio:1;border-radius:50%;background:#fff;box-shadow:0 0 45px 25px #fff,0 0 120px 65px #f1bd63;animation:evolutionBurst 3.2s ease forwards}.evolutionContent h3{color:var(--gold);font-size:1.35rem;margin:0}.evolutionContent .cta{margin-top:16px}.evolutionOverlay:not(.revealed) #finishEvolution{visibility:hidden}.evolutionOverlay.revealed #finishEvolution{animation:fadeUp .5s ease both}.evolutionOverlay.revealed .evolutionOld{opacity:0}.evolutionOverlay.revealed .evolutionNew{opacity:1}@keyframes evolutionSpin{to{transform:rotate(360deg)}}@keyframes evolutionOld{0%,48%{opacity:1;transform:scale(1)}68%,100%{opacity:0;transform:scale(.72);filter:brightness(5) drop-shadow(0 0 30px #fff)}}@keyframes evolutionNew{0%,58%{opacity:0;transform:scale(.65);filter:brightness(5)}78%,100%{opacity:1;transform:scale(1);filter:drop-shadow(0 18px 25px #0008)}}@keyframes evolutionBurst{0%,38%{transform:scale(.25);opacity:.25}68%{transform:scale(1.5);opacity:1}100%{transform:scale(.7);opacity:.15}}@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}}@media (prefers-reduced-motion:reduce){.evolutionSky,.evolutionAvatar,.evolutionBurst{animation:none}.evolutionOld{opacity:0}.evolutionNew{opacity:1}}\n.healthReview{padding:14px 0;border-top:1px solid var(--line)}.healthReview select{width:100%;min-height:48px;background:var(--base);color:var(--ink)}\n.sectionHeading{flex-wrap:wrap}.sectionValue{white-space:normal}\n#auth .hero{max-height:45svh;background-size:cover;background-position:center 32%}\n#profile .hero{max-height:160px;background-size:cover}\n.modalOverlay{overscroll-behavior:contain}.modalCard{max-height:calc(100dvh - 40px)}\n@media(max-width:380px){.characterGrid{grid-template-columns:repeat(2,minmax(0,1fr))}.characterChoice img{max-height:100px}.grid{grid-template-columns:1fr}.page{padding-inline:12px}}\n</style></head>\n<body><div id=\"qaErrors\" role=\"status\"></div><script>window.addEventListener(\"error\",e=>{document.getElementById(\"qaErrors\").textContent+=e.message+\"; \"});window.addEventListener(\"unhandledrejection\",e=>{document.getElementById(\"qaErrors\").textContent+=String(e.reason)+\"; \"});<\/script>\n<div class=\"app\">\n<section id=\"auth\">\n<div class=\"hero\" role=\"img\" aria-label=\"Road to 42 animal runners on a trail above Rome\">\n</div>\n<div class=\"setup\">\n<div class=\"authBrand\">\n<img src=\"assets/brand/icon-192.png\" alt=\"\" width=\"48\" height=\"48\">\n<div class=\"kicker\">RUN \u00b7 LEVEL UP \u00b7 BELONG</div>\n</div>\n<h1>Your road starts here.</h1>\n<p class=\"sub\">Train. Level up. Challenge your people.</p>\n<div class=\"card\">\n<button id=\"googleLogin\" class=\"cta google\">\n<svg aria-hidden=\"true\" viewBox=\"0 0 48 48\" width=\"22\" height=\"22\">\n<path fill=\"#4285F4\" d=\"M43.6 24.5c0-1.5-.1-2.9-.4-4.3H24v8.1h11c-.5 2.6-1.9 4.8-4.1 6.3v5.2h6.7c3.9-3.6 6-8.9 6-15.3z\"/>\n<path fill=\"#34A853\" d=\"M24 44c5.5 0 10.1-1.8 13.5-4.9l-6.7-5.2c-1.8 1.2-4.1 1.9-6.8 1.9-5.3 0-9.8-3.6-11.4-8.4H5.7v5.4C9 39.5 16 44 24 44z\"/>\n<path fill=\"#FBBC05\" d=\"M12.6 27.4a12 12 0 0 1 0-6.8v-5.4H5.7a20 20 0 0 0 0 17.6z\"/>\n<path fill=\"#EA4335\" d=\"M24 12.2c3 0 5.7 1 7.8 3.1l5.9-5.9C34.1 6.1 29.5 4 24 4 16 4 9 8.5 5.7 15.2l6.9 5.4c1.6-4.8 6.1-8.4 11.4-8.4z\"/>\n</svg>\n<span>Sign in with Google</span>\n</button>\n</div>\n<p class=\"authHint\">One Google account. Your runner, your progress, everywhere.</p>\n<p class=\"sub\"><a href=\"privacy.html\">Privacy</a> \u00b7 <a href=\"terms.html\">Using Road to 42</a></p>\n<div id=\"authMsg\" class=\"notice hidden\" role=\"status\">\n</div>\n</div>\n</section>\n<section id=\"profile\" class=\"hidden\">\n<div class=\"hero\" role=\"img\" aria-label=\"Road to 42 animal runners on a trail above Rome\">\n</div>\n<div class=\"setup\">\n<div class=\"profileSetupHead\">\n<div>\n<div class=\"kicker\">WELCOME TO ROAD TO 42</div>\n<h1>Create your runner.</h1>\n<p class=\"sub\">Set up your journey once. Your Google account will keep your progress safe.</p>\n</div>\n<img id=\"setupAvatar\" class=\"setupAvatar\" alt=\"\">\n</div>\n<form id=\"profileForm\" class=\"card\">\n<div class=\"characterIntro\">\n<div>\n<small>CHOOSE YOUR RUNNER</small>\n<h3 id=\"profileCharacterName\">Choose an animal</h3>\n</div>\n<span class=\"sub\">Evolves as you level up</span>\n</div>\n<p class=\"sub\">Choose carefully: your character is permanent after you start your journey.</p>\n<div id=\"profileCharacters\" class=\"characterGrid\">\n</div>\n<label class=\"field\">YOUR NAME<input id=\"newName\" required maxlength=\"50\" autocomplete=\"given-name\">\n</label>\n<div class=\"grid\">\n<label class=\"field\">WEEKLY RUNNING GOAL (KM)<input id=\"baseKm\" min=\"1\" max=\"500\" step=\"0.1\" required type=\"number\" value=\"25\">\n</label>\n<label class=\"field\">RUNS PER WEEK<input id=\"baseRuns\" min=\"1\" max=\"21\" required type=\"number\" value=\"3\">\n</label>\n</div>\n<div class=\"grid\">\n<label class=\"field\">GOAL<select id=\"goal\">\n<option>Marathon</option>\n<option>Half Marathon</option>\n<option>10K</option>\n<option>5K</option>\n</select>\n</label>\n<label class=\"field\">RACE DATE<input id=\"raceDate\" required type=\"date\" value=\"2027-03-14\">\n</label>\n</div>\n<label class=\"checkLabel\"><input id=\"publicProfile\" type=\"checkbox\"> Show my runner and training progress on the community leaderboard</label><p class=\"sub\">Your email stays private. You can change this choice in Runner settings.</p>\n<button id=\"join\" type=\"submit\" class=\"cta\">Start my journey</button>\n<div id=\"profileMsg\" class=\"notice hidden\" role=\"status\">\n</div>\n</form>\n<button type=\"button\" id=\"setupDeleteAccount\" class=\"textButton\">Delete this trial account</button>\n<button type=\"button\" id=\"setupLogout\" class=\"textButton\">Use a different Google account</button>\n</div>\n</section>\n<section id=\"main\" class=\"hidden\">\n<header class=\"top\">\n<img class=\"brandIcon\" src=\"assets/brand/icon-192.png\" alt=\"Road to 42\">\n<div>\n<small>ROAD TO 42 \u00b7 <span class=\"cloud\">Connected</span>\n</small>\n<h2 id=\"who\">\n</h2>\n</div>\n<button id=\"notificationButton\" class=\"notificationButton\" type=\"button\" aria-label=\"Open notifications\">\ud83d\udd14<span id=\"notificationCount\" class=\"notificationCount hidden\">0</span></button>\n<button class=\"pill\" data-go=\"more\">Profile</button>\n</header>\n<main>\n<section id=\"home\" class=\"page active\">\n<div class=\"homeCover\" role=\"img\" aria-label=\"Road to 42: animal runners exploring Rome\">\n</div>\n<div class=\"quickActions\">\n<button data-go=\"checkin\">\n<span><svg class=\"uiIcon\" aria-hidden=\"true\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 5v14M5 12h14\"/></svg></span>Log a run</button>\n<button data-go=\"training\">\n<span><svg class=\"uiIcon\" aria-hidden=\"true\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 20V10m8 10V4m8 16V7\"/></svg></span>Activity</button>\n<button data-go=\"compete\">\n<span><svg class=\"uiIcon\" aria-hidden=\"true\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M8 3h8v7a4 4 0 0 1-8 0zM8 5H4v3a4 4 0 0 0 4 4m8-7h4v3a4 4 0 0 1-4 4m-4 2v6m-4 0h8\"/></svg></span>Compete</button>\n</div>\n<div class=\"dashhero\">\n<img id=\"heroAvatar\" class=\"heroAvatar\" alt=\"\">\n<div class=\"heroText\">\n<small>YOUR ROAD TO</small>\n<b id=\"event\">\n</b>\n<span id=\"days\">\n</span>\n<div id=\"evolutionTag\" class=\"evolutionTag\">\n</div>\n</div>\n</div>\n<div class=\"card journeyCard\">\n<div class=\"sectionHeading\"><div><small>TRAINING JOURNEY</small><h3>Next checkpoint</h3></div><span id=\"journeyKm\" class=\"sectionValue\">0 km logged</span></div>\n<div id=\"journeyMap\" class=\"journeyMap\" aria-label=\"Journey progress\"></div>\n<p id=\"journeyMessage\" class=\"sub\"></p>\n</div>\n<div class=\"stats\">\n<div>\n<b id=\"total\">0</b>\n<span>TOTAL XP</span>\n</div>\n<div>\n<b id=\"week\">0</b>\n<span>KM THIS WEEK</span>\n</div>\n<div>\n<b id=\"runsCount\">0</b>\n<span>RUNS</span>\n</div>\n</div>\n<div class=\"card xpCard\">\n<div class=\"xpTop\">\n<div>\n<small>LEVEL PROGRESS</small>\n<h3 id=\"level\">\n</h3>\n</div>\n<div class=\"xpBig\">\n<span id=\"xpNow\">0</span> XP</div>\n</div>\n<div class=\"bar\">\n<i id=\"xpbar\">\n</i>\n</div>\n<p id=\"xpText\">\n</p>\n<p id=\"xpDistance\" class=\"xpDistance\" aria-live=\"polite\"></p>\n</div>\n<div class=\"card\">\n<div style=\"display:flex;justify-content:space-between\">\n<div>\n<b>Runner Power</b>\n<p class=\"sub\">Balanced development</p>\n</div>\n<div class=\"power\">\n<span id=\"power\">0</span>\n<small>/100</small>\n</div>\n</div>\n<div class=\"bar\">\n<i id=\"powerbar\">\n</i>\n</div>\n<div class=\"gates\">\n<div class=\"gate\">\n<b id=\"gXP\">\n</b>\n<span>XP \u00b7 DISTANCE</span>\n</div>\n<div class=\"gate\">\n<b id=\"gEnd\">\n</b>\n<span>ENDURANCE</span>\n</div>\n<div class=\"gate\">\n<b id=\"gSpeed\">\n</b>\n<span>QUALITY PACE</span>\n</div>\n<div class=\"gate\">\n<b id=\"gCons\">\n</b>\n<span>CONSISTENCY</span>\n</div>\n</div>\n</div>\n<div class=\"card rewardsCard\">\n<div class=\"sectionHeading\"><div><small>REWARDS</small><h3>Trail collection</h3></div><span id=\"rewardCount\" class=\"sectionValue\">0/18</span></div>\n<div id=\"rewardGrid\" class=\"rewardGrid\"></div>\n</div>\n<div class=\"card streakCard\">\n<div class=\"sectionHeading\"><div><small>CONSISTENCY</small><h3 id=\"streakTitle\">Your rhythm</h3></div><span id=\"streakCount\" class=\"sectionValue\">0 days</span></div>\n<p id=\"streakMessage\" class=\"sub\"></p>\n</div>\n<div class=\"card\">\n<b>TODAY</b>\n<p class=\"sub\">Build your journey, one day at a time.</p>\n<button class=\"cta\" data-go=\"checkin\">Log today\u2019s activity</button>\n</div>\n</section>\n<section id=\"training\" class=\"page\">\n<div class=\"title\">\n<small>TRAINING LOG</small>\n<h2>Your activity</h2>\n<p class=\"sub\">Every step is part of your story.</p>\n</div>\n<div id=\"recent\">\n</div>\n</section>\n<section id=\"checkin\" class=\"page\">\n<div class=\"title\">\n<small>DAILY INPUT</small>\n<h2>Log your training.</h2>\n<p class=\"sub\">Record a run or a recovery day. An optional wellbeing note helps you reflect on how training feels.</p>\n</div>\n<form id=\"checkinForm\">\n<div class=\"card\">\n<h3>Activity</h3>\n<div class=\"logtype\" id=\"types\">\n<button type=\"button\" class=\"on\" data-type=\"Rest\">Rest</button>\n<button type=\"button\" data-type=\"Easy\">Easy run</button>\n<button type=\"button\" data-type=\"Quality\">Quality</button>\n<button type=\"button\" data-type=\"Long\">Long run</button>\n<button type=\"button\" data-type=\"Strength\">Strength</button>\n<button type=\"button\" data-type=\"Cross\">Cross-train</button>\n</div>\n<div class=\"grid\">\n<label class=\"field\">DISTANCE KM<input id=\"km\" disabled type=\"number\" min=\"0\" max=\"500\" step=\".1\" required value=\"0\">\n</label>\n<label class=\"field\">MINUTES<input id=\"mins\" type=\"number\" min=\"0\" max=\"10080\" step=\"0.1\" required value=\"0\">\n</label>\n</div>\n<label class=\"field\">PACE (OPTIONAL)<input id=\"pace\" disabled placeholder=\"6:30\" inputmode=\"decimal\" pattern=\"[0-9]{1,2}:[0-5][0-9]\" title=\"Minutes and seconds, for example 6:30\">\n</label>\n</div>\n<details class=\"wellbeing\"><summary>How are you feeling? (optional)</summary><label class=\"checkLabel\"><input type=\"checkbox\" id=\"wellbeingEnabled\"> Save a wellbeing note with this activity</label>\n<div class=\"card\">\n<h3>Sleep quality</h3>\n<p class=\"sub scaleHint\">1 \u00b7 Poor <span>5 \u00b7 Restful</span>\n</p>\n<div class=\"scale\" role=\"radiogroup\" aria-label=\"Sleep quality\" data-scale=\"sleep\">\n</div>\n<label class=\"field\">SLEEP HOURS<input id=\"hours\" min=\"0\" max=\"24\" required type=\"number\" step=\".1\" value=\"7\">\n</label>\n</div>\n<div class=\"card\">\n<h3>Energy</h3>\n<p class=\"sub scaleHint\">1 \u00b7 Low <span>5 \u00b7 High</span>\n</p>\n<div class=\"scale\" role=\"radiogroup\" aria-label=\"Energy\" data-scale=\"energy\">\n</div>\n</div>\n<div class=\"card\">\n<h3>Soreness</h3>\n<p class=\"sub scaleHint\">1 \u00b7 None <span>5 \u00b7 Very sore</span>\n</p>\n<div class=\"scale\" role=\"radiogroup\" aria-label=\"Soreness\" data-scale=\"soreness\">\n</div>\n</div>\n<div id=\"readinessCard\" class=\"card readinessCard hidden\">\n<small>YOUR WELLBEING NOTE</small>\n<h3 id=\"readinessTitle\">Training recommendation</h3>\n<p id=\"readinessText\" class=\"sub\"></p>\n</div>\n</details>\n<button id=\"saveDay\" type=\"submit\" class=\"cta\">Save activity</button>\n<div id=\"saved\" class=\"notice hidden\" role=\"status\">\n</div>\n</form>\n</section>\n<section id=\"compete\" class=\"page\">\n<div class=\"title\">\n<small>ROAD TO 42 COMMUNITY</small>\n<h2>Run together.</h2>\n<p class=\"sub\">Runners ranked by balanced Runner Power.</p>\n</div>\n<div class=\"card challengeCard\">\n<small>THIS WEEK'S CHALLENGE</small>\n<h3>Go the distance together</h3>\n<p class=\"sub\">Reach your weekly target and earn the Weekly goal reward. Compare progress with the community below.</p>\n<div class=\"challengeBar\"><i id=\"challengeBarFill\"></i></div>\n<div class=\"challengeMeta\"><span id=\"challengeProgress\">0 / 25 km</span><span id=\"challengeStatus\">In progress</span></div>\n</div>\n<div id=\"leaderboard\">\n</div>\n</section>\n<section id=\"more\" class=\"page\">\n<div class=\"title\">\n<small>ROAD TO 42</small>\n<h2>Your runner.</h2>\n<p class=\"sub\">Your identity, character and progress in one place.</p>\n</div>\n<div class=\"card account accountHero\">\n<img id=\"avatar\" class=\"avatar\" alt=\"\">\n<div>\n<b id=\"accountName\">\n</b>\n<div id=\"accountEmail\" class=\"sub\">\n</div>\n<div class=\"cloud\">Progress synced</div>\n</div>\n<button class=\"accountHome\" type=\"button\" data-go=\"home\" aria-label=\"Back to home\">\u2302</button>\n</div>\n<div class=\"card runnerIdentity\">\n<div class=\"characterIntro\">\n<div>\n<small>YOUR RUNNER</small>\n<h3 id=\"accountCharacterName\">Wolf</h3>\n</div>\n<span class=\"lockBadge\">LOCKED</span>\n</div>\n<div class=\"runnerIdentityBody\">\n<img id=\"runnerProfileAvatar\" class=\"runnerProfileAvatar\" alt=\"\">\n<div>\n<div id=\"avatarStatus\" class=\"pickerStatus\" aria-live=\"polite\">\n</div>\n<p class=\"sub\">Your character evolves as you train. The choice is permanent so your journey remains yours.</p>\n</div>\n</div>\n</div>\n<form id=\"runnerSettings\" class=\"card\">\n<h3>Your training goals</h3>\n<div class=\"grid\"><label class=\"field\">WEEKLY KM<input id=\"editWeeklyKm\" type=\"number\" min=\"1\" max=\"500\" step=\"0.1\" required></label><label class=\"field\">RUNS PER WEEK<input id=\"editRuns\" type=\"number\" min=\"1\" max=\"21\" required></label></div>\n<div class=\"grid\"><label class=\"field\">GOAL<select id=\"editGoal\"><option>Marathon</option><option>Half Marathon</option><option>10K</option><option>5K</option></select></label><label class=\"field\">RACE DATE<input id=\"editRaceDate\" type=\"date\" required></label></div>\n<label class=\"checkLabel\"><input id=\"editPublic\" type=\"checkbox\"> Show my runner and training progress on the leaderboard</label>\n<button class=\"secondaryButton\" type=\"submit\">Save goals</button><p id=\"settingsMessage\" role=\"status\" class=\"sub\"></p>\n</form>\n<div id=\"healthCard\" class=\"card\">\n<small>CONNECTED RUNS</small><h3>Google Health</h3>\n<p class=\"sub\">Import running sessions from 14 September 2026. Walking and cycling do not count. Sync your watch with its companion app first.</p>\n<p class=\"sub\">Run dates, distances and durations are saved to Road to 42. Your training follows your leaderboard privacy choice above.</p>\n<p id=\"healthStatus\" role=\"status\" class=\"sub\">Checking connection\u2026</p>\n<button id=\"connectHealth\" class=\"secondaryButton\" type=\"button\">Connect Google Health</button>\n<button id=\"syncHealth\" class=\"secondaryButton hidden\" type=\"button\">Sync runs now</button>\n<button id=\"disconnectHealth\" class=\"textButton hidden\" type=\"button\">Disconnect Google Health</button>\n<div id=\"healthDuplicates\"></div>\n</div>\n<div class=\"card menu profileActions\">\n<button id=\"logout\" class=\"logoutButton\">\u21aa &nbsp;Log out</button>\n<button id=\"openDeleteAccount\" class=\"deleteAccountButton\" type=\"button\">Delete account and data</button>\n</div>\n</section>\n</main>\n<nav class=\"nav\" aria-label=\"Main navigation\">\n<button c
